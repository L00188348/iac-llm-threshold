# Global experiment parameters
experiment:
  name: "IaC Threshold Calibration"
  random_seed: 42
  n_candidates: 5
  threshold_min: 0.0
  threshold_max: 1.0
  threshold_step: 0.1
  language: "hcl"

llm:
  provider: "google"
  model: "gemini-1.5-pro"
  temperature: 0.8
  max_tokens: 2048

paths:
  prompts: "data/prompts/prompts.json"
  candidates_dir: "data/candidates/raw"
  reference_labels: "data/reference_standard/reference_labels.csv"
  run_output: "data/runs/{run_id}"